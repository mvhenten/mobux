name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-rs downloads the prebuilt onnxruntime/sherpa-onnx libs
          # here; without caching it, a warm target/ cache makes cargo skip
          # the build-script download and the linker can't find -lonnxruntime.
          cache-directories: ~/.cache/sherpa-rs
      - run: cargo check
      - run: cargo test
      - run: cargo clippy -- -D warnings

  local-tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: local-tts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The voice is pinned by content, so its own hash is the cache key: a
      # refreshed checkpoint misses the cache and is fetched, an unchanged one
      # never leaves it.
      - id: voice
        run: |
          echo "sha=$(node -e 'process.stdout.write(require("./src/local_tts/voice.lock.json").files["voice.onnx"].sha256)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .tmp/tts-voice
          key: tts-voice-${{ steps.voice.outputs.sha }}
      - name: Fetch the voice on a cache miss
        run: node scripts/tts-voice.mjs ensure .tmp/tts-voice
      - run: cargo clippy --features local-tts --all-targets -- -D warnings
      - run: cargo build --release --features local-tts
      # Real weights, real synthesis — the one thing the default suite cannot
      # cover, and the only place the realtime margin is measured.
      - name: Speak a normalized block
        run: cargo test --release --features local-tts -- --ignored speaks_a_normalized_block
        env:
          MOBUX_TTS_MODEL_TEST: "1"
          MOBUX_TTS_MODEL_DIR: ${{ github.workspace }}/.tmp/tts-voice

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-rs downloads the prebuilt onnxruntime/sherpa-onnx libs
          # here; without caching it, a warm target/ cache makes cargo skip
          # the build-script download and the linker can't find -lonnxruntime.
          cache-directories: ~/.cache/sherpa-rs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - run: sudo apt-get install -y tmux
      - name: Build mobux
        run: cargo build
      - name: Run critical-path tests
        run: make test-critical-path
        env:
          CI: true
          MOBUX_URL: http://localhost:8281
      - name: Run smoke tests
        run: make test-smoke
        env:
          CI: true
          MOBUX_URL: http://localhost:8281
      - name: Run SPA (/app) tests
        run: make test-spa
        env:
          CI: true
          MOBUX_URL: http://localhost:8281
      - name: Run renderer conformance tests
        run: make test-conformance
        env:
          CI: true
          MOBUX_URL: http://localhost:8281

  fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-rs downloads the prebuilt onnxruntime/sherpa-onnx libs
          # here; without caching it, a warm target/ cache makes cargo skip
          # the build-script download and the linker can't find -lonnxruntime.
          cache-directories: ~/.cache/sherpa-rs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - run: sudo apt-get install -y tmux
      - name: Run fleet tests
        run: make test-fleet
        env:
          CI: true
