name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-rs downloads the prebuilt onnxruntime/sherpa-onnx libs
          # here; without caching it, a warm target/ cache makes cargo skip
          # the build-script download and the linker can't find -lonnxruntime.
          cache-directories: ~/.cache/sherpa-rs
      - name: Ensure sherpa-onnx libs present
        # A warm target/ cache can restore without ~/.cache/sherpa-rs, so cargo
        # skips the build-script download and the prebuilt .so is absent on disk
        # (link fails with -lonnxruntime, or the binary fails to load it at run
        # time). Force sherpa-rs-sys to rebuild so the download re-runs.
        shell: bash
        run: |
          if [ -z "$(find "$HOME/.cache/sherpa-rs" -name 'libsherpa-onnx-c-api.so' 2>/dev/null)" ]; then
            echo "sherpa-onnx libs missing from cache — forcing sherpa-rs-sys rebuild"
            cargo clean -p sherpa-rs-sys
          fi
      - run: cargo check
      - run: cargo test --no-run
      - run: cargo clippy -- -D warnings

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-rs downloads the prebuilt onnxruntime/sherpa-onnx libs
          # here; without caching it, a warm target/ cache makes cargo skip
          # the build-script download and the linker can't find -lonnxruntime.
          cache-directories: ~/.cache/sherpa-rs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - run: sudo apt-get install -y tmux
      - name: Ensure sherpa-onnx libs present
        # See the check job: a warm target/ cache can restore without
        # ~/.cache/sherpa-rs, leaving the prebuilt .so absent so the binary
        # fails to load libsherpa-onnx-c-api.so at run time. Force a rebuild.
        shell: bash
        run: |
          if [ -z "$(find "$HOME/.cache/sherpa-rs" -name 'libsherpa-onnx-c-api.so' 2>/dev/null)" ]; then
            echo "sherpa-onnx libs missing from cache — forcing sherpa-rs-sys rebuild"
            cargo clean -p sherpa-rs-sys
          fi
      - name: Build mobux
        run: cargo build
      - name: Export sherpa-onnx lib path
        # The binary's rpath points at a content-hashed dir under
        # ~/.cache/sherpa-rs; when target/ and the sherpa cache restore from
        # different builds those hashes diverge, so resolve the lib's real dir
        # and put it on LD_LIBRARY_PATH for the test steps.
        shell: bash
        run: |
          LIBDIR=$(find "$HOME/.cache/sherpa-rs" -name 'libsherpa-onnx-c-api.so' -printf '%h\n' 2>/dev/null | head -1)
          echo "Found sherpa-onnx libs in: ${LIBDIR:-<none>}"
          echo "LD_LIBRARY_PATH=${LIBDIR}:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Run critical-path tests
        run: make test-critical-path
        env:
          CI: true
          MOBUX_URL: http://localhost:8281
      - name: Run smoke tests
        run: make test-smoke
        env:
          CI: true
          MOBUX_URL: http://localhost:8281

  release-plz-pr:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-release:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
