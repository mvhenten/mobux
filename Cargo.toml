[package]
name = "mobux"
version = "0.1.5"
edition = "2021"
description = "A touch-friendly tmux web UI for unhinged people who run terminal sessions from their phone while walking the dog"
license = "MIT"
repository = "https://github.com/mvhenten/mobux"
homepage = "https://github.com/mvhenten/mobux"
readme = "README.md"
keywords = ["tmux", "terminal", "mobile", "web", "tui"]
categories = ["command-line-utilities", "web-programming"]
exclude = ["target/"]

[features]
default = []
# In-process neural text-to-speech. The runtime is onnxruntime through `ort`,
# which links a prebuilt library rather than building one, and the
# grapheme-to-phoneme step is pure Rust — so no cmake, no C++ toolchain and no
# espeak-ng. It roughly doubles the binary, so it is opt-in.
local-tts = [
    "dep:ort",
    "dep:piper-plus-g2p",
    "dep:flate2",
    "dep:tar",
    "dep:sha2",
]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "json", "multipart"] }
base64 = "0.22"
futures-util = "0.3"
html-escape = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rust-embed = { version = "8", features = ["include-exclude", "mime-guess"] }
portable-pty = "0.8"
rand = "0.9"
rcgen = { version = "0.13", features = ["x509-parser"] }
# x509-parser feature lets us read an existing CA cert PEM back into rcgen
# (CertificateParams::from_ca_cert_pem) so we can re-bind a previously generated
# CA across restarts.
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"
rustls-pki-types = "1"
rustls-pemfile = "2"
hostname = "0.4"
chrono = "0.4.44"
rusqlite = { version = "0.39", features = ["bundled"] }
directories = "6"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
instant-acme = "0.8"
time = "0.3"
web-push-native = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
vte = "0.15"
serde_path_to_error = "0.1"
schemars = "1"
garde = { version = "0.22", features = ["derive"] }
# Pinned exactly: ort 2 is still a prerelease, and its release candidates move
# the session API. The prebuilt onnxruntime it links is downloaded by its build
# script, so this needs no cmake and no C++ toolchain.
ort = { version = "=2.0.0-rc.13", optional = true }
# CMU-dictionary grapheme-to-phoneme, IPA out, Piper phoneme ids after it.
# espeak-ng free, which is what keeps the C++ toolchain out of the build.
piper-plus-g2p = { version = "0.4", default-features = false, features = ["english"], optional = true }
# Unpacking the release tarball the voice rides in, and checking it against
# the hashes in src/local_tts/voice.lock.json. miniz_oxide backend: no zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"
axum = { version = "0.8", features = ["ws", "json", "multipart"] }
