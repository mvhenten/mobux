# sherpa-rs (with the default `download-binaries` feature) emits the
# onnxruntime + sherpa-onnx shared libraries into the cargo target dir next to
# the mobux binary, but does NOT bake an rpath into the executable — so a bare
# `./target/debug/mobux` fails at load with "libsherpa-onnx-c-api.so: not
# found". Adding `$ORIGIN` to the rpath makes the binary look for those libs in
# its own directory, so `make start` / `make test-smoke` (which run
# `./target/<profile>/mobux` from the repo root) work without callers having to
# set LD_LIBRARY_PATH. (The container copies the binary elsewhere and sets
# LD_LIBRARY_PATH explicitly — see Containerfile.)
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-Wl,-rpath,$ORIGIN"]

# +fp16 on aarch64: gemm-common 0.19 (pulled by candle, behind the local-stt
# feature) emits ARMv8.2 half-precision instructions from inline asm without
# declaring the target feature, so the assembler rejects them. Every aarch64
# host that can run whisper has FEAT_FP16. A `cargo install` does not read this
# file — see README for the flag to pass there.
[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C",
    "link-args=-Wl,-rpath,$ORIGIN",
    "-C",
    "target-feature=+fp16",
]
