<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: Android Chrome resizes the LAYOUT
         viewport when the soft keyboard opens, sized from the OS window insets
         (keyboard + Chrome's autofill accessory bar included). The default
         (resizes-visual) only shrinks visualViewport, whose reported height
         does not account for the accessory bar — the JS body-height tracking
         in terminal.js then leaves the input bar and bottom terminal rows
         clipped behind the keyboard (issue #167). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>Mobux</title>
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🤖</text></svg>'
    />
    <meta name="theme-color" content="#0f1115" />
    <!-- Reuse the existing app stylesheet (served by the Rust backend through
         the Vite proxy) so the ported pages match the current look. Relative,
         like every other asset here: the document is served at <prefix>/app, so
         this resolves to <prefix>/static/style.css inside whatever mount the
         proxy publishes. In dev the document sits at /static/spa/, so it lands
         on /static/spa/static/style.css and the proxy rewrite catches it. -->
    <link rel="stylesheet" href="./static/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
